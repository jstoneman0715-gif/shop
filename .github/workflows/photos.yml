name: Localise product photos

# Pulls every remote product image into assets/photos/ and rewrites the
# catalogue to point at the local copy, so the shop stops depending on someone
# else's server for its photography. Run it by hand from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download images and rewrite the catalogue
        run: python3 tools/check_images.py --download

      - name: Rebuild with the local images
        run: |
          python3 tools/build_site.py
          python3 tools/build_onepage.py
          python3 tools/check_site.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --staged --quiet; then
            echo "No image changes."
          else
            git commit -m "chore: host product photos locally instead of hotlinking"
            git push
          fi
