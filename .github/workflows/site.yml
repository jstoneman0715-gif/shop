name: Build & deploy site

# The whole site is automated from here:
#   * edit data/products.json (prices, products, Stripe links) and push
#   * this workflow regenerates every page, validates it, and publishes
#   * search engines are notified that the pages changed
# Pull requests run build + validation only — nothing is published from them.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, after the weekend's cards are in the books
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test the ranking logic
        run: python3 tools/test_catalogue.py

      - name: Generate site
        run: python3 tools/build_site.py

      - name: Generate the single-file storefront
        run: python3 tools/build_onepage.py

      - name: Validate site
        run: python3 tools/check_site.py

      # Reports dead product images. Not strict: a card with a broken photo
      # falls back to its generated plate and the shop still works, so this
      # should surface the problem, not block a deploy over it.
      - name: Check product images
        continue-on-error: true
        run: python3 tools/check_images.py

      - name: Commit regenerated pages
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A . ':!.cache'
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Site already up to date."
          else
            git commit -m "chore: rebuild site from catalogue"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Best effort only: telling Bing and Yandex about new URLs must never be
      # able to fail the job that publishes the site.
      - name: Notify search engines
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'schedule'
        continue-on-error: true
        run: python3 tools/submit_indexnow.py

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement:true turns GitHub Pages on for this repository the first time
      # the workflow runs, so there is no settings page to visit by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
